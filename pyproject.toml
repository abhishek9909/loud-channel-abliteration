[project]
name = "loudchannel"
version = "0.1.0"
description = "Outlier residual-stream channels and the difference-of-means refusal direction: measurement, corrected estimators, and the causal role of the channel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "interpretability", "activation-steering", "outlier-dimensions", "nnsight"]

dependencies = [
    "nnsight>=0.6",
    "torch>=2.2",
    # Gemma-3 checkpoints are multimodal-registered and load their processor
    # through torchvision even for text-only use
    "torchvision",
    "transformers>=4.48",
    "accelerate>=0.30",
    "datasets>=2.19",
    "numpy",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml",
    "tqdm",
]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loudchannel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
